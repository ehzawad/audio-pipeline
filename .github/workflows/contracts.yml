name: contracts
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    services:
      redis:
        image: redis:8.2.9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,rtc,cluster]'
      - run: python -m pytest -q --junitxml=verification/ci-junit.xml
      - run: python -m compileall -q duplex_voice scripts
      - run: python -m pip freeze > verification/ci-dependencies.txt
      - run: node --test clients/javascript/voice.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contracts-${{ matrix.python }}
          path: verification/ci-*
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path clients/swift
