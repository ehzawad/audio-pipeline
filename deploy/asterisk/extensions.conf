; Merge into an existing Asterisk installation; do not overwrite unrelated dialplans.
; This is an inbound/private extension, not a provider-specific trunk definition.
[voicebot-test]
exten => 7001,1,Answer()
 same => n,Set(VOICE_UUID=${UUID()})
 ; Gateway on the same host. For a separate host, use its PRIVATE/VPN address.
 same => n,AudioSocket(${VOICE_UUID},127.0.0.1:9092)
 same => n,Hangup()
