; Loopback-only lab. Asterisk places a real SIP/RTP (G.711 mu-law) call to itself, so the
; gateway is exercised behind an actual PJSIP channel. This is not a carrier trunk.
[transport-loopback]
type = transport
protocol = udp
bind = 127.0.0.1:5060

[voicebot-loop]
type = endpoint
transport = transport-loopback
context = voicebot-test
disallow = all
allow = ulaw
direct_media = no
media_address = 127.0.0.1
bind_rtp_to_media_address = yes
aors = voicebot-loop

[voicebot-loop]
type = aor
contact = sip:127.0.0.1:5060

[voicebot-loop]
type = identify
endpoint = voicebot-loop
match = 127.0.0.1

; Optional LAN softphone, written by install.sh only when LAB_SOFTPHONE_SECRET is set.
