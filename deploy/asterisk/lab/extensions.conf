; Lab dialplan only. [voicebot-test] is the same route as ../extensions.conf.
[general]
static = yes
writeprotect = yes

[default]

[voicebot-test]
exten => 7001,1,Answer()
 same => n,Set(VOICE_UUID=${UUID()})
 same => n,AudioSocket(${VOICE_UUID},127.0.0.1:9092)
 same => n,Hangup()

; Same caller experience through the gateway's Twilio route, via scripts/twilio_emulator.py.
exten => 7002,1,Answer()
 same => n,AudioSocket(${UUID()},127.0.0.1:9094)
 same => n,Hangup()
