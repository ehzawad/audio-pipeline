[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "duplex-voice"
version = "3.0.0"
description = "Interruptible English voice gateway, local speech service, WebRTC and telephony"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.9,<3",
  "numpy>=1.26,<3", "soxr>=0.5,<2", "httpx>=0.27,<1",
  "websockets>=14,<17", "python-dotenv>=1,<2", "python-multipart>=0.0.18,<1", "PyJWT>=2.10,<3", "prometheus-client>=0.21,<1"
]
[project.optional-dependencies]
cluster = ["redis>=6,<8"]
vad = ["onnxruntime>=1.20,<2", "huggingface-hub>=0.27,<2"]
rtc = ["aiortc>=1.14,<2"]
speech = ["sherpa-onnx>=1.12,<2", "kokoro>=0.9.4,<1", "soundfile>=0.13,<1", "huggingface-hub>=0.27,<2"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]
browser = ["playwright>=1.50,<2"]

[tool.setuptools.packages.find]
include = ["duplex_voice*"]
[tool.setuptools.package-data]
duplex_voice = ["static/*", "assets/*.xz"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["redis: disposable real Redis contracts enabled by TEST_REDIS_URL", "rtc: requires aiortc and PyAV; real track frame test", "live: explicitly enabled real model test"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
